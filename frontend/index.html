<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Recognition System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-8 max-w-lg w-full">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">🎙️ Speech Recognition</h1>

    <!-- File Upload Section -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Audio File Choose Karein:</label>
      <input type="file" id="audioFile" accept="audio/*" 
             class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      <button id="uploadBtn" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">
        📁 File Transcribe Karein
      </button>
    </div>

    <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t border-gray-300"></div>
      <span class="flex-shrink mx-4 text-gray-400 text-xs font-bold">YA PHIR</span>
      <div class="flex-grow border-t border-gray-300"></div>
    </div>

    <!-- Live Recording Section -->
    <div class="flex gap-4 my-4">
      <button id="recordBtn" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg">
        🎙️ Start Record
      </button>
      <button id="stopBtn" disabled class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg disabled:opacity-50">
        ⏹️ Stop & Transcribe
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center my-4 text-blue-600 font-medium animate-pulse">
      ⏳ Audio processing chal rahi hai...
    </div>

    <!-- Output Box -->
    <div class="mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Transcribed Text:</label>
      <div id="result" class="w-full min-h-[100px] p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm whitespace-pre-wrap">
        Aapka text yahan show hoga...
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
