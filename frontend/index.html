<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Speech Recognition System</h1>
            <p>Convert audio to text with AI-powered transcription</p>
        </div>

        <div class="main-content">
            <!-- Upload Section -->
            <div class="section upload-section">
                <h2>Upload Audio File</h2>
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Drag and drop your audio file here</p>
                    <p style="font-size: 12px; color: #999; margin-top: 10px;">or click to browse</p>
                    <input type="file" id="fileInput" accept="audio/*" hidden>
                </div>
                <div class="file-info" id="fileInfo" style="display: none;">
                    <p id="fileName"></p>
                    <p id="fileSize"></p>
                </div>

                <div class="language-select">
                    <label for="language">Language (Optional):</label>
                    <select id="language">
                        <option value="">Auto-detect</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ur">Urdu</option>
                        <option value="hi">Hindi</option>
                        <option value="ar">Arabic</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ru">Russian</option>
                        <option value="ko">Korean</option>
                    </select>
                </div>

                <button id="transcribeBtn" class="btn btn-primary" disabled>
                    <span>Transcribe Audio</span>
                    <span class="spinner" id="spinner" style="display: none;"></span>
                </button>
            </div>

            <!-- Results Section -->
            <div class="section results-section" id="resultsSection" style="display: none;">
                <h2>Transcription Results</h2>
                
                <div class="result-metadata">
                    <div class="metadata-item">
                        <label>File Name:</label>
                        <p id="resultFilename"></p>
                    </div>
                    <div class="metadata-item">
                        <label>Language:</label>
                        <p id="resultLanguage"></p>
                    </div>
                    <div class="metadata-item">
                        <label>Confidence:</label>
                        <p id="resultConfidence"></p>
                    </div>
                    <div class="metadata-item">
                        <label>Duration:</label>
                        <p id="resultDuration"></p>
                    </div>
                </div>

                <div class="transcript-box">
                    <label>Transcript:</label>
                    <div class="transcript-text" id="transcriptText"></div>
                    <button class="btn btn-secondary" onclick="copyToClipboard()">📋 Copy Text</button>
                    <button class="btn btn-secondary" onclick="downloadTranscript()">⬇️ Download</button>
                </div>

                <div class="segments-box" id="segmentsBox" style="display: none;">
                    <h3>Detailed Segments</h3>
                    <div id="segmentsList"></div>
                </div>
            </div>

            <!-- History Section -->
            <div class="section history-section">
                <h2>Recent Transcriptions</h2>
                <div id="historyList" class="history-list">
                    <p style="color: #999;">No transcriptions yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
